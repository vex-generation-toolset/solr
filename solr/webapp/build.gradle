import groovy.json.JsonOutput
import groovy.json.JsonSlurper
import java.security.MessageDigest

plugins {
  id 'java'
  id 'war'
}

description = 'Solr webapp'

configurations {
  war {}
  serverLib
  solrCore
  generatedJSClient
  generatedJSClientBundle
}

ext {
  jsClientWorkspace = layout.buildDirectory.dir("jsClientWorkspace").get()
  jsClientBuildDir = layout.buildDirectory.dir("jsClientBuild").get()
  jsClientBundleDir = layout.buildDirectory.dir("jsClientBundle").get()
  browserifyVersion = "17.0.0"
}

dependencies {
  permitUnusedDeclared project(":solr:core")
  serverLib project(path: ":solr:server", configuration: "libExt")
  serverLib project(path: ":solr:server", configuration: "serverLib")
  solrCore project(":solr:core")
  implementation(configurations.solrCore - configurations.serverLib)

  generatedJSClient project(path: ":solr:api", configuration: "jsClient")
  generatedJSClientBundle files(jsClientBundleDir) {
    builtBy "finalizeJsBundleDir"
  }
}

task syncJSClientSourceCode(type: Sync) {
  group = 'Solr JS Client'
  from configurations.generatedJSClient

  into jsClientWorkspace

  // Keep the node modules, so that they don't need to be re-downloaded
  preserve {
    include "node_modules/**"
  }

  // The OpenAPI generator declares @babel/cli as a runtime dependency, although it only builds
  // the client and is not among the packages browserify bundles into the shipped file. Left
  // alone it makes "npm install --omit=dev" pull in the whole Babel tree, and the SBOM of the
  // bundle claim some seventy packages that are not in it.
  doLast {
    def manifestFile = file("${jsClientWorkspace}/package.json")
    def manifest = new JsonSlurper().parse(manifestFile)
    def misplaced = manifest.dependencies?.keySet()?.findAll { it.startsWith('@babel/') } ?: []
    if (misplaced) {
      misplaced.each { manifest.devDependencies[it] = manifest.dependencies.remove(it) }
      manifestFile.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + "\n"
      logger.lifecycle("Moved ${misplaced.join(', ')} to devDependencies: build-only tooling")
    }
  }
}

task jsClientDownloadDeps(type: NpmTask) {
  group = 'Solr JS Client'
  dependsOn tasks.syncJSClientSourceCode

  args = ["install"]
  workingDir = file(jsClientWorkspace)

  inputs.dir("${jsClientWorkspace}/src")
  inputs.file("${jsClientWorkspace}/package.json")
  outputs.dir("${jsClientWorkspace}/node_modules")
}

task jsClientBuild(type: NpmTask) {
  group = 'Solr JS Client'
  dependsOn tasks.jsClientDownloadDeps

  args = ["run", "build"]
  workingDir = file(jsClientWorkspace)

  inputs.dir("${jsClientWorkspace}/src")
  inputs.file("${jsClientWorkspace}/package.json")
  inputs.dir("${jsClientWorkspace}/node_modules")
  outputs.dir("${jsClientWorkspace}/dist")
}

task downloadBrowserify(type: NpmTask) {
  group = 'Build Dependency Download'
  args = ["install", "browserify@${browserifyVersion}"]

  inputs.property("browserify version", browserifyVersion)
  outputs.dir("${nodeProjectDir}/node_modules/browserify")
}

task generateJsClientBundle(type: NpxTask) {
  group = 'Solr JS Client'
  dependsOn tasks.downloadBrowserify
  dependsOn tasks.jsClientBuild

  command = 'browserify'
  args = ['dist/index.js', '-s', 'solrApi', '-o', "${jsClientBuildDir}/index.js"]
  workingDir = file(jsClientWorkspace)

  inputs.dir(jsClientWorkspace)
  inputs.property("browserify version", browserifyVersion)

  outputs.file("${jsClientBuildDir}/index.js")
}

task finalizeJsBundleDir(type: Sync) {
  group = 'Solr JS Client'

  from configurations.generatedJSClient {
    include "README.md"
    include "docs/**"
  }

  from tasks.generateJsClientBundle {
    include "index.js"
  }

  into jsClientBundleDir
}

war {
  from (configurations.generatedJSClientBundle, {
    into "libs/solr"
  })
}

// Expose 'war' archive as an artifact so that it can be packaged in the distribution.
artifacts {
  war tasks.war
}

// CycloneDX SBOM of the npm packages browserified into the client bundle shipped as
// server/solr-webapp/webapp/libs/solr/index.js. Merged into the distribution SBOMs by
// :solr:packaging, see gradle/solr/sbom.gradle.

def cyclonedxNpmVersion = "6.0.0"
def jsClientSbomFile = layout.buildDirectory.file("cyclonedx/bom-js-client.json").get().asFile

task downloadCyclonedxNpm(type: NpmTask) {
  group = 'Build Dependency Download'
  args = ["install", "@cyclonedx/cyclonedx-npm@${cyclonedxNpmVersion}"]

  inputs.property("cyclonedx-npm version", cyclonedxNpmVersion)
  outputs.dir("${nodeProjectDir}/node_modules/@cyclonedx/cyclonedx-npm")
}

task generateJsClientSbom(type: NpxTask) {
  group = 'Bill of Materials'
  description = 'Generates the CycloneDX SBOM of the JavaScript client bundle'

  dependsOn tasks.downloadCyclonedxNpm
  // Needs the package-lock.json and node_modules produced by the install
  dependsOn tasks.jsClientDownloadDeps

  // The full package spec, since the bare "cyclonedx-npm" command name resolves to an
  // unrelated npm package. Runs from the node project dir, where downloadCyclonedxNpm
  // installed the pinned version, and points at the workspace manifest instead.
  command = "@cyclonedx/cyclonedx-npm@${cyclonedxNpmVersion}"
  args = [
      // Only the packages bundled into the shipped file, not the build tooling
      "--omit", "dev",
      // Match the spec version emitted by the CycloneDX Gradle plugin in :solr:packaging
      "--spec-version", "1.6",
      "--output-reproducible",
      "--output-format", "JSON",
      "--output-file", jsClientSbomFile.absolutePath,
      "${jsClientWorkspace}/package.json",
  ]
  workingDir = file(nodeProjectDir)

  inputs.file("${jsClientWorkspace}/package.json")
  inputs.file("${jsClientWorkspace}/package-lock.json")
  inputs.property("cyclonedx-npm version", cyclonedxNpmVersion)
  outputs.file(jsClientSbomFile)
}

configurations {
  jsClientSbom {
    canBeConsumed = true
    canBeResolved = false
  }
}

artifacts {
  jsClientSbom(jsClientSbomFile) {
    builtBy tasks.generateJsClientSbom
  }
}

// web/libs holds checked-in third-party JavaScript, described for the distribution SBOM by
// vendored-libs.json. These tasks keep the two in sync: validateVendoredLibs fails on any drift,
// updateVendoredLibs refreshes the hashes. The manifest sits outside web/, which goes into the war.
def vendoredLibsManifest = file('vendored-libs.json')
def vendoredLibsDir = file('web/libs')

def sha256Of = { File f ->
  def digest = MessageDigest.getInstance('SHA-256')
  f.eachByte(8192) { buffer, length -> digest.update(buffer, 0, length) }
  digest.digest().encodeHex().toString()
}

tasks.register('validateVendoredLibs') {
  group = 'Verification'
  description = 'Checks that web/libs matches the components declared in vendored-libs.json'

  inputs.file(vendoredLibsManifest).withPropertyName('manifest')
      .withPathSensitivity(PathSensitivity.NONE)
  inputs.dir(vendoredLibsDir).withPropertyName('vendoredLibs')
      .withPathSensitivity(PathSensitivity.RELATIVE)
  def marker = layout.buildDirectory.file('vendored-libs-validated.txt')
  outputs.file(marker)

  doLast {
    def manifest = new JsonSlurper().parse(vendoredLibsManifest)
    def onDisk = vendoredLibsDir.listFiles().findAll { it.file }.collectEntries { [(it.name): it] }
    def errors = []

    (onDisk.keySet() - manifest.keySet()).sort().each {
      errors << "${it}: present in ${vendoredLibsDir} but absent from ${vendoredLibsManifest.name}."
    }
    (manifest.keySet() - onDisk.keySet()).sort().each {
      errors << "${it}: declared in ${vendoredLibsManifest.name} but no such file in ${vendoredLibsDir}."
    }

    manifest.each { fileName, component ->
      def file = onDisk[fileName]
      if (file == null) {
        return
      }
      ['type', 'bom-ref', 'name', 'purl', 'licenses', 'hashes'].each { field ->
        if (!component[field]) {
          errors << "${fileName}: component is missing the required '${field}' field."
        }
      }
      def declared = component.hashes?.find { it.alg == 'SHA-256' }?.content
      if (declared == null) {
        errors << "${fileName}: component declares no SHA-256 hash."
      } else {
        def actual = sha256Of(file)
        if (declared != actual) {
          errors << "${fileName}: content changed, SHA-256 is ${actual} but the component declares " +
              "${declared}. Review the component (version, licence, pedigree) and run 'gradlew " +
              ":solr:webapp:updateVendoredLibs' to refresh the hash."
        }
      }
    }

    if (errors) {
      throw new GradleException("Vendored JavaScript does not match ${vendoredLibsManifest}:\n  " +
          errors.join("\n  "))
    }
    marker.get().asFile.text = "${manifest.size()} vendored components validated\n"
  }
}

tasks.matching { it.name == 'check' }.configureEach {
  it.dependsOn 'validateVendoredLibs'
}

tasks.register('updateVendoredLibs') {
  group = 'Build Dependencies'
  description = 'Refreshes the SHA-256 hashes in vendored-libs.json'

  doLast {
    // JsonSlurper hands back a LinkedHashMap, so the declaration order survives the round trip.
    def manifest = new JsonSlurper().parse(vendoredLibsManifest)
    def onDisk = vendoredLibsDir.listFiles().findAll { it.file }.sort { it.name }

    onDisk.each { file ->
      def component = manifest[file.name]
      if (component == null) {
        // A stub only: identity, licence and pedigree cannot be inferred from the file, so
        // validateVendoredLibs keeps failing until they are filled in by hand.
        logger.lifecycle("${file.name}: new file, added a stub component that must be completed by hand")
        manifest[file.name] = [
            type: 'library',
            'bom-ref': null,
            name: null,
            hashes: [[alg: 'SHA-256', content: sha256Of(file)]],
            licenses: null,
            purl: null,
        ]
      } else {
        def actual = sha256Of(file)
        if (component.hashes?.find { it.alg == 'SHA-256' }?.content != actual) {
          logger.lifecycle("${file.name}: refreshed SHA-256")
          component.hashes = [[alg: 'SHA-256', content: actual]]
        }
      }
    }

    def removed = manifest.keySet() - onDisk.collect { it.name } as Set
    removed.each {
      logger.lifecycle("${it}: file is gone, dropping the component")
      manifest.remove(it)
    }

    vendoredLibsManifest.text = JsonOutput.prettyPrint(JsonOutput.toJson(manifest.sort { it.key })) + "\n"
  }
}
